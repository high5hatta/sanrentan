<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firebase通信！サンレンタン風ゲーム</title>
    <style>
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background-color: #eef2f7; color: #333; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { max-width: 500px; width: 100%; background: white; padding: 30px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; }
        h1 { color: #e63946; font-size: 24px; margin-bottom: 20px; }
        h2 { font-size: 18px; color: #4a4a4a; margin-bottom: 15px; }
        .odai { background-color: #ffe3e3; padding: 15px; border-radius: 8px; font-weight: bold; font-size: 18px; margin-bottom: 20px; border-left: 5px solid #e63946; }
        .btn-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
        .option-btn { padding: 12px; font-size: 16px; background-color: #f8f9fa; border: 2px solid #ddd; border-radius: 8px; cursor: pointer; text-align: left; position: relative; }
        .option-btn.selected { background-color: #e63946; color: white; border-color: #e63946; }
        .badge { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); background: white; color: #e63946; border-radius: 50%; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 14px; }
        .main-btn { background-color: #1d3557; color: white; border: none; padding: 15px 30px; font-size: 18px; border-radius: 8px; cursor: pointer; width: 100%; font-weight: bold; margin-top: 10px; }
        .main-btn:disabled { background-color: #ccc; cursor: not-allowed; }
        .sub-btn { background-color: #457b9d; color: white; }
        .screen { display: none; }
        .screen.active { display: block; }
        .room-number { font-size: 42px; font-weight: bold; color: #e63946; letter-spacing: 5px; margin: 20px 0; background: #fff3f3; padding: 10px; border-radius: 8px; }
        .input-box { width: 80%; padding: 12px; font-size: 24px; text-align: center; border: 2px solid #ddd; border-radius: 8px; margin-bottom: 20px; }
        .status-text { color: #666; font-style: italic; margin-top: 15px; }
        .result-box { text-align: left; background: #f8f9fa; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
        .score { font-size: 32px; color: #e63946; font-weight: bold; margin: 20px 0; }
    </style>
</head>
<body>

<div class="container">
    <div id="screen-mode" class="screen active">
        <h1>サンレンタン Firebase版</h1>
        <p>どちらの役割にするか選んでください。</p>
        <button class="main-btn" onclick="createRoom()">部屋を作る（出題者）</button>
        <button class="main-btn sub-btn" onclick="showJoinScreen()">部屋に入る（回答者）</button>
    </div>

    <div id="screen-host-wait" class="screen">
        <h2>部屋を作成しました</h2>
        <p>相手に下の4桁の数字を教えてください：</p>
        <div class="room-number" id="display-room-id">----</div>
        <p class="status-text" id="host-status">相手の接続を待っています...</p>
    </div>

    <div id="screen-guest-join" class="screen">
        <h2>部屋に参加する</h2>
        <p>相手から教えてもらった4桁の数字を入力してください：</p>
        <input type="number" id="input-room-id" class="input-box" placeholder="1234">
        <button class="main-btn" onclick="joinRoom()">接続する</button>
        <p class="status-text" id="guest-status"></p>
    </div>

    <div id="screen-questioner" class="screen">
        <h2>【あなたの番（出題者）】</h2>
        <p>自分のベスト3を順番に選んで送信してください。</p>
        <div class="odai" id="q-odai">お題を読み込み中...</div>
        <div class="btn-list" id="q-options"></div>
        <button class="main-btn" id="q-send-btn" disabled onclick="sendHostAnswers()">回答を送信する</button>
    </div>

    <div id="screen-answerer" class="screen">
        <h2>【あなたの番（回答者）】</h2>
        <div id="wait-for-host-msg">
            <p class="status-text">出題者が選んでいます。しばらくお待ちください...</p>
        </div>
        <div id="action-for-guest" style="display:none;">
            <p>相手のベスト3を予想して選んでください！</p>
            <div class="odai" id="a-odai">お題</div>
            <div class="btn-list" id="a-options"></div>
            <button class="main-btn" id="a-send-btn" disabled onclick="sendGuestAnswers()">予想を送信する</button>
        </div>
    </div>

    <div id="screen-result" class="screen">
        <h1>結果発表</h1>
        <div class="score" id="result-score">0点</div>
        <div class="result-box">
            <h3>🎯 出題者のホンネ</h3>
            <p id="q-ans-text"></p>
        </div>
        <div class="result-box">
            <h3>🔮 あなたの予想</h3>
            <p id="a-ans-text"></p>
        </div>
        <button class="main-btn" onclick="location.reload()">もう一度遊ぶ</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, onValue, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // 🛠️ あなたのFirebaseプロジェクトの設定に書き換えてください！
    const firebaseConfig = {
        apiKey: "YOUR_API_KEY",
        authDomain: "YOUR_AUTH_DOMAIN",
        databaseURL: "YOUR_DATABASE_URL",
        projectId: "YOUR_PROJECT_ID",
        storageBucket: "YOUR_STORAGE_BUCKET",
        messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
        appId: "YOUR_APP_ID"
    };

    // Firebaseの初期化
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // --- ゲームのロジック ---
    const database = [
        { title: "お弁当のおかずで入っていたら一番嬉しいのは？", options: ["から揚げ", "ハンバーグ", "卵焼き", "ウインナー", "エビフライ", "ポテトサラダ", "鮭の塩焼き"] },
        { title: "もし無人島に1つだけ持っていけるなら？", options: ["サバイバルナイフ", "ライター", "寝袋", "釣り竿", "大きなテント", "スマホ（電波なし）", "相棒の犬"] },
        { title: "タイムマシンがあったら一番行きたい時代は？", options: ["恐竜の時代", "江戸時代", "戦国時代", "昭和レトロ", "100年後の未来", "1000年後の未来", "自分の子供時代"] }
    ];

    let myRole = ""; 
    let roomNum = ""; 
    let currentData = {};
    let questionerSelection = [];
    let answererSelection = [];

    // 画面切り替え
    window.changeScreen = function(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(screenId).classList.add('active');
    }
    window.showJoinScreen = function() { changeScreen('screen-guest-join'); }

    // 【出題者】部屋を作る
    window.createRoom = function() {
        myRole = "host";
        roomNum = String(Math.floor(1000 + Math.random() * 9000));
        document.getElementById('display-room-id').innerText = roomNum;
        changeScreen('screen-host-wait');

        const odaiIndex = Math.floor(Math.random() * database.length);

        // Firebaseに部屋データを作成
        set(ref(db, 'rooms/' + roomNum), {
            odaiIndex: odaiIndex,
            status: 'waiting',
            hostSelection: "",
            guestSelection: ""
        });

        // データの変化を監視
        listenRoom();
    }

    // 【回答者】部屋に入る
    window.joinRoom = function() {
        myRole = "guest";
        roomNum = document.getElementById('input-room-id').value;
        if (!roomNum) return alert("4桁の数字を入力してください");

        document.getElementById('guest-status').innerText = "接続中...";
        
        // 部屋が存在するか一度確認して監視開始
        const roomRef = ref(db, 'rooms/' + roomNum);
        onValue(roomRef, (snapshot) => {
            if (snapshot.exists()) {
                document.getElementById('guest-status').innerText = "接続成功！";
                // 参加状態へ更新
                update(ref(db, 'rooms/' + roomNum), { status: 'playing' });
                listenRoom();
            } else {
                document.getElementById('guest-status').innerText = "部屋が見つかりません。";
            }
        }, { onlyOnce: true });
    }

    // Firebaseの部屋をリアルタイム監視するコアシステム
    function listenRoom() {
        const roomRef = ref(db, 'rooms/' + roomNum);
        onValue(roomRef, (snapshot) => {
            const data = snapshot.val();
            if (!data) return;

            currentData = database[data.odaiIndex];

            // 状態に応じた画面遷移
            if (myRole === "host") {
                if (data.status === 'playing' && document.getElementById('screen-host-wait').classList.contains('active')) {
                    // ゲストが入ってきたら出題開始
                    startHostGame();
                }
                if (data.status === 'guest_submitted') {
                    // ゲストが答え終わったら結果表示
                    answererSelection = data.guestSelection;
                    calculateAndShowResult();
                }
            } else if (myRole === "guest") {
                if (data.status === 'playing') {
                    changeScreen('screen-answerer');
                    document.getElementById('a-odai').innerText = currentData.title;
                }
                if (data.status === 'host_submitted') {
                    questionerSelection = data.hostSelection;
                    document.getElementById('wait-for-host-msg').style.display = 'none';
                    document.getElementById('action-for-guest').style.display = 'block';
                    renderOptions('a-options', answererSelection, 'a-send-btn');
                }
                if (data.status === 'guest_submitted') {
                    calculateAndShowResult();
                }
            }
        });
    }

    function startHostGame() {
        document.getElementById('q-odai').innerText = currentData.title;
        renderOptions('q-options', questionerSelection, 'q-send-btn');
        changeScreen('screen-questioner');
    }

    // ボタンの描画
    function renderOptions(containerId, selectionList, buttonId) {
        const container = document.getElementById(containerId);
        container.innerHTML = '';
        
        currentData.options.forEach(option => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = option;
            
            const index = selectionList.indexOf(option);
            if (index !== -1) {
                btn.classList.add('selected');
                const badge = document.createElement('span');
                badge.className = 'badge';
                badge.innerText = index + 1;
                btn.appendChild(badge);
            }
            
            btn.onclick = () => {
                const existingIndex = selectionList.indexOf(option);
                if (existingIndex !== -1) {
                    selectionList.splice(existingIndex, 1);
                } else if (selectionList.length < 3) {
                    selectionList.push(option);
                }
                renderOptions(containerId, selectionList, buttonId);
                document.getElementById(buttonId).disabled = (selectionList.length !== 3);
            };
            container.appendChild(btn);
        });
    }

    // 出題者：回答をFirebaseに送信
    window.sendHostAnswers = function() {
        update(ref(db, 'rooms/' + roomNum), {
            status: 'host_submitted',
            hostSelection: questionerSelection
        });
        document.getElementById('q-options').innerHTML = "<p class='status-text'>回答者の予想を待っています...</p>";
        document.getElementById('q-send-btn').style.display = 'none';
    }

    // 回答者：予想をFirebaseに送信
    window.sendGuestAnswers = function() {
        update(ref(db, 'rooms/' + roomNum), {
            status: 'guest_submitted',
            guestSelection: answererSelection
        });
    }

    // 点数計算
    function calculateAndShowResult() {
        let scoreText = "";
        const q1 = questionerSelection[0], q2 = questionerSelection[1], q3 = questionerSelection[2];
        const a1 = answererSelection[0], a2 = answererSelection[1], a3 = answererSelection[2];
        
        if (q1 === a1 && q2 === a2 && q3 === a3) scoreText = "🎉 サンレンタン！（6点）";
        else if (q1 === a1 && q2 === a2) scoreText = "👍 ニレンタン！（3点）";
        else if (questionerSelection.includes(a1) && questionerSelection.includes(a2) && questionerSelection.includes(a3)) scoreText = "✨ サンレンプク！（4点）";
        else scoreText = "😢 ハズレ（0点）";

        document.getElementById('result-score').innerText = scoreText;
        document.getElementById('q-ans-text').innerHTML = `1位: ${q1}<br>2位: ${q2}<br>3位: ${q3}`;
        document.getElementById('a-ans-text').innerHTML = `1位: ${a1}<br>2位: ${a2}<br>3位: ${a3}`;
        
        changeScreen('screen-result');
    }
</script>
</body>
</html>
